name: Profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG cards
        env:
          # Optional PAT secret; the default token sees public data only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python scripts/stats.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/metrics.json
          git diff --cached --quiet || git commit -m "Update profile stats"
          git pull --rebase --quiet && git push
